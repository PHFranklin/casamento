<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayra & Pedro - Dia dos Namorados</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: #fff;
        }

        /* --- SLIDESHOW DO FUNDO --- */
        #background-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: top center;
            object-fit: cover;
            opacity: 0;
            transform: scale(1.1);
            /* AJUSTE: Transição de opacidade mais rápida (1s) para acompanhar o ritmo */
            transition: opacity 1s ease-in-out, transform 8s ease-out;
            filter: brightness(25%) grayscale(20%);
        }

        .bg-slide.active {
            opacity: 1;
            transform: scale(1);
        }

        /* --- EFEITO CHUVA DE CORAÇÕES --- */
        #hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .heart-particle {
            position: absolute;
            top: -10%;
            color: #ff4d4d;
            font-size: 1.5rem;
            opacity: 0.6;
            animation: fall linear forwards;
            filter: blur(1px);
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .foreground-content {
            position: relative;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 25px 30px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9);
            max-width: 90%;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .names-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            font-weight: 700;
            color: #ffcccc;
            margin-bottom: 0;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.6);
            letter-spacing: 2px;
        }

        #valentines-message {
            display: none;
            color: #ff6b81;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 107, 129, 0.8);
            animation: pulse-text 2s infinite;
        }

        @keyframes pulse-text {
            0% {
                opacity: 0.8;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }

            100% {
                opacity: 0.8;
                transform: scale(1);
            }
        }

        /* --- CARTA COM EFEITO FLIP (Giro 3D) --- */
        .flip-scene {
            width: 280px;
            height: 280px;
            perspective: 1000px;
            transform: rotate(-2deg);
        }

        .flip-card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(5px);
        }

        .card-back {
            transform: rotateY(180deg);
            background: rgba(255, 255, 255, 0.65);
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .card-back h3 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #d63031;
            margin-bottom: 15px;
            line-height: 1.1;
        }

        .card-back p {
            font-size: 1.1rem;
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            color: #444;
            line-height: 1.4;
        }

        .fg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            opacity: 0;
            transform: scale(1.15);
            transition: opacity 1s ease-in-out, transform 5s ease-out;
        }

        .fg-slide.active {
            opacity: 0.65;
            transform: scale(1);
        }

        /* --- CONTADOR --- */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 5px;
            border-radius: 10px;
            min-width: 80px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.05);
        }

        .time-box span {
            display: block;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .time-box p {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 5px;
            font-weight: 400;
            color: #ccc;
        }

        /* --- BOTÃO CORAÇÃO PULSANTE --- */
        .heart-btn {
            font-size: 2.2rem;
            cursor: pointer;
            margin-top: 10px;
            animation: heartbeat 1.5s infinite;
            filter: drop-shadow(0 4px 10px rgba(255, 50, 50, 0.6));
            user-select: none;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }

            14% {
                transform: scale(1.15);
            }

            28% {
                transform: scale(1);
            }

            42% {
                transform: scale(1.15);
            }

            70% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div id="background-slideshow"></div>
    <div id="hearts-container"></div>

    <div class="foreground-content">
        <h1 class="names-title">Mayra & Pedro</h1>

        <p id="valentines-message">Feliz Dia dos Namorados</p>

        <div class="flip-scene">
            <div class="flip-card" id="surprise-card">

                <div class="card-face card-front" id="main-carousel"></div>

                <div class="card-face card-back">
                    <h3>Feliz Dia dos Namorados!</h3>
                    <p>Te amo meu amor, ontem, hoje e para todo sempre</p>
                </div>

            </div>
        </div>

        <div>
            <div class="timer-grid">
                <div class="time-box"><span id="years">0</span>
                    <p>Anos</p>
                </div>
                <div class="time-box"><span id="months">0</span>
                    <p>Meses</p>
                </div>
                <div class="time-box"><span id="days">0</span>
                    <p>Dias</p>
                </div>
                <div class="time-box"><span id="hours">0</span>
                    <p>Horas</p>
                </div>
                <div class="time-box"><span id="minutes">0</span>
                    <p>Minutos</p>
                </div>
                <div class="time-box"><span id="seconds">0</span>
                    <p>Segundos</p>
                </div>
            </div>
        </div>

        <div class="heart-btn" onclick="toggleSurprise()">❤️</div>
    </div>

    <script>
        const imagensPrincipais = [];
        const imagensFundo = [];

        // Certifique-se de que este caminho reflete como suas imagens estão salvas no GitHub
        for (let i = 1; i <= 11; i++) {
            imagensPrincipais.push(`principais/foto-principal-${i}.jpg`);
        }

        for (let i = 1; i <= 150; i++) {
            imagensFundo.push(`secundarias/fundo-${i}.jpg`);
        }

        for (let i = 151; i <= 159; i++) {
            imagensFundo.push(`secundarias/fundo-${i}.mp4`);
        }

        // AJUSTE: Reduzido de 6000 (6s) para 2500 (2.5s) para passar mais rápido
        const tempoFundo = 2500; 
        const tempoPrincipal = 4000;
        const startDate = new Date(2021, 1, 27, 10, 50, 0);

        function criarElemento(url, cssClass, isBackground) {
            let elemento;
            const extensao = url.split('.').pop().toLowerCase();

            if (extensao === 'mp4') {
                elemento = document.createElement('video');
                elemento.src = url;
                elemento.autoplay = true;
                elemento.loop = true;
                elemento.muted = true;
                elemento.playsInline = true;
                elemento.className = cssClass;
                elemento.style.objectPosition = "center center";
            } else {
                if (isBackground) {
                    elemento = document.createElement('div');
                    elemento.style.backgroundImage = `url('${url}')`;
                    elemento.className = cssClass;
                } else {
                    elemento = document.createElement('img');
                    elemento.src = url;
                    elemento.className = cssClass;
                }
            }
            return elemento;
        }

        function inicializarSlideshows() {
            const bgContainer = document.getElementById('background-slideshow');
            const fgContainer = document.getElementById('main-carousel');

            imagensFundo.sort(() => Math.random() - 0.5);
            imagensPrincipais.sort(() => Math.random() - 0.5);

            imagensFundo.forEach((url, index) => {
                const el = criarElemento(url, 'bg-slide', true);
                if (index === 0) el.classList.add('active');
                bgContainer.appendChild(el);
            });

            imagensPrincipais.forEach((url, index) => {
                const el = criarElemento(url, 'fg-slide', false);
                if (index === 0) el.classList.add('active');
                fgContainer.appendChild(el);
            });

            let currentBg = 0;
            setInterval(() => {
                const slides = document.querySelectorAll('.bg-slide');
                if (slides.length > 1) {
                    slides[currentBg].classList.remove('active');
                    currentBg = (currentBg + 1) % slides.length;
                    slides[currentBg].classList.add('active');
                }
            }, tempoFundo);

            let currentFg = 0;
            setInterval(() => {
                const slides = document.querySelectorAll('.fg-slide');
                if (slides.length > 1) {
                    slides[currentFg].classList.remove('active');
                    currentFg = (currentFg + 1) % slides.length;
                    slides[currentFg].classList.add('active');
                }
            }, tempoPrincipal);
        }

        function updateCounter() {
            const now = new Date();

            if (now.getDate() === 12 && now.getMonth() === 5) {
                document.getElementById('valentines-message').style.display = 'block';
            } else {
                document.getElementById('valentines-message').style.display = 'none';
            }

            let years = now.getFullYear() - startDate.getFullYear();
            let months = now.getMonth() - startDate.getMonth();
            let days = now.getDate() - startDate.getDate();
            let hours = now.getHours() - startDate.getHours();
            let minutes = now.getMinutes() - startDate.getMinutes();
            let seconds = now.getSeconds() - startDate.getSeconds();

            if (seconds < 0) { seconds += 60; minutes--; }
            if (minutes < 0) { minutes += 60; hours--; }
            if (hours < 0) { hours += 24; days--; }
            if (days < 0) {
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                days += prevMonth.getDate();
                months--;
            }
            if (months < 0) { months += 12; years--; }

            document.getElementById('years').innerText = years;
            document.getElementById('months').innerText = months;
            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }

        function toggleSurprise() {
            const card = document.getElementById('surprise-card');
            card.classList.toggle('is-flipped');
        }

        function createHeartDrop() {
            const container = document.getElementById('hearts-container');
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = '❤️';

            heart.style.left = Math.random() * 100 + 'vw';

            const size = Math.random() * 1.5 + 0.5;
            heart.style.transform = `scale(${size})`;

            heart.style.animationDuration = Math.random() * 5 + 5 + 's';

            container.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 10000);
        }

        window.onload = () => {
            inicializarSlideshows();
            updateCounter();
            setInterval(updateCounter, 1000);
            
            setInterval(createHeartDrop, 200);
        };
    </script>
</body>

</html>
